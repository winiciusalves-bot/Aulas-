<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Espaçonave</title><style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;color:#e8f0ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:8px 0}
.card{background:#0f1830;border-radius:16px;padding:16px;margin:12px 0}
a.btn,button{display:inline-block;background:#2a7de1;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;text-decoration:none;margin:4px;cursor:pointer}
button.alt{background:transparent;border:2px solid #5aa2ff}
.help{opacity:.8;font-size:14px}
#space{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(#0a1230,#05070d);overflow:hidden}
#space .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:warp 3s linear infinite}
@keyframes warp{from{transform:scale(.2);opacity:0}to{transform:scale(4);opacity:1}}
#space::before{content:"";position:absolute;inset:-50%;background-image:linear-gradient(rgba(90,240,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(90,240,255,.12) 1px,transparent 1px);background-size:48px 48px;transform:perspective(500px) rotateX(60deg);animation:gridmove 4s linear infinite}
@keyframes gridmove{to{background-position:0 48px}}
#space .sun{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(#fff3a0,#ffb800 60%,#ff7a00);box-shadow:0 0 60px #5af0ffaa,0 0 120px #2a7de1aa}
#space .orb{position:absolute;left:50%;top:50%;border:1px dashed #5af0ff55;border-radius:50%;animation:spin linear infinite}
#space .pl{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
#space .o1{width:120px;height:120px;margin:-60px 0 0 -60px;animation-duration:6s}
#space .o2{width:190px;height:190px;margin:-95px 0 0 -95px;animation-duration:10s}
#space .o3{width:270px;height:270px;margin:-135px 0 0 -135px;animation-duration:15s}
#space .o4{width:350px;height:350px;margin:-175px 0 0 -175px;animation-duration:22s}
body>*:not(#space):not(.painel){position:relative;z-index:1}
.bonecos{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.bonecos figure{margin:0;width:150px}.boneco{width:140px;height:auto;animation:bob 2.4s ease-in-out infinite}figcaption{margin-top:6px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.foguete-btn{display:block;margin:12px auto;background:none;border:0;cursor:pointer;width:110px;color:#e8f0ff}
.foguete-btn svg{width:110px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px #5af0ff)}
@media (prefers-reduced-motion: reduce){#space *,.boneco,.foguete-btn svg{animation:none!important}}
.painel{position:fixed;inset:0;z-index:9;background:#05070ddd;display:none;align-items:center;justify-content:center;padding:16px}
.painel.on{display:flex}
.caixa{background:#0a1830;border:2px solid #5af0ff;border-radius:16px;padding:18px;max-width:420px;width:100%;box-sizing:border-box;max-height:90vh;overflow:auto}
.caixa input[type=text],.caixa input[type=password]{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b4a80;background:#0f1830;color:#e8f0ff;font-size:16px;margin:4px 0 10px}
.caixa button.go{width:100%;background:#2a7de1;color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;cursor:pointer}
.caixa button.go:disabled{opacity:.5}
.caixa .x{float:right;background:none;border:0;color:#e8f0ff;font-size:22px;cursor:pointer}
#msgacesso{min-height:1.4em;font-size:14px}
</style></head><body>
<div id="space"><div class="sun"></div>
<div class="orb o1"><i class="pl" style="background:#b5b5b5"></i></div>
<div class="orb o2"><i class="pl" style="background:#e0a86b"></i></div>
<div class="orb o3"><i class="pl" style="background:#4a9fe8"></i></div>
<div class="orb o4"><i class="pl" style="background:#d9573b"></i></div></div>
<h1 style="font-size:28px;margin:4px 0 2px">Bem-vindo ao universo</h1>
<p class="help" style="font-size:16px">Você está entrando no computador infinito. Toque no foguete para entrar na sua espaçonave.</p>
<div class="card" style="text-align:center"><div class="bonecos">
<figure><svg class="boneco" viewBox="0 0 200 200" role="img" aria-label="Byte, robô azul"><line x1="100" y1="20" x2="100" y2="40" stroke="#2a7de1" stroke-width="4"/><circle cx="100" cy="16" r="6" fill="#ff7a59"/><rect x="45" y="40" width="110" height="100" rx="18" fill="#2a7de1"/><rect x="62" y="62" width="76" height="40" rx="8" fill="#dff1ff"/><circle cx="82" cy="82" r="7" fill="#1d2433"/><circle cx="118" cy="82" r="7" fill="#1d2433"/><path d="M80 95 Q100 107 120 95" stroke="#1d2433" stroke-width="4" fill="none"/><rect x="60" y="142" width="80" height="28" rx="8" fill="#1f5fb3"/></svg><figcaption>Byte<br><span class="help">Grupo A · terça 16h</span></figcaption></figure>
<figure><svg class="boneco" viewBox="0 0 200 200" role="img" aria-label="Pixel, boneca verde-água"><line x1="100" y1="35" x2="100" y2="16" stroke="#2e9e8a" stroke-width="4"/><circle cx="100" cy="95" r="60" fill="#5fd0b8"/><rect x="58" y="80" width="36" height="26" rx="8" fill="none" stroke="#1d2433" stroke-width="4"/><rect x="106" y="80" width="36" height="26" rx="8" fill="none" stroke="#1d2433" stroke-width="4"/><line x1="94" y1="90" x2="106" y2="90" stroke="#1d2433" stroke-width="4"/><circle cx="76" cy="93" r="5" fill="#1d2433"/><circle cx="124" cy="93" r="5" fill="#1d2433"/><path d="M86 120 Q100 130 114 120" stroke="#1d2433" stroke-width="4" fill="none"/></svg><figcaption>Pixel<br><span class="help">Grupo B · terça 15h</span></figcaption></figure>
</div><p class="help">Os professores do computador infinito.</p></div>
<button id="abrir" class="foguete-btn" aria-label="Entrar na espaçonave"><svg viewBox="0 0 60 90"><path d="M30 2 C44 22 46 50 40 70 L20 70 C14 50 16 22 30 2Z" fill="#dfe8ff" stroke="#5aa2ff" stroke-width="2"/><circle cx="30" cy="38" r="7" fill="#2a7de1"/><path d="M20 62 L8 80 L22 74Z M40 62 L52 80 L38 74Z" fill="#ff7a59"/><path d="M24 72 Q30 92 36 72Z" fill="#ffb800"/></svg><span class="help">Entrar</span></button>
<div class="card"><p>Use o link que você recebeu para entrar na sua espaçonave.</p></div>
<p class="help">Nada é coletado. A skin fica salva só no aparelho onde você a criou.</p>

<div id="painel" class="painel" role="dialog" aria-modal="true" aria-labelledby="titulo-acesso"><div class="caixa">
<button class="x" id="fechar" aria-label="Fechar">×</button>
<h2 id="titulo-acesso" style="font-size:20px;margin:0 0 12px">Entrar</h2>
<form id="form-acesso">
  <label for="a-user">Usuário</label><input id="a-user" type="text" required autocomplete="username" autocapitalize="off" spellcheck="false">
  <label for="a-senha">Senha</label><input id="a-senha" type="password" required autocomplete="current-password">
  <button id="a-enviar" class="go" type="submit">Entrar</button>
  <p id="msgacesso" role="status"></p>
</form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const SUPABASE_URL='https://damgyslmdexmkkhojtmj.supabase.co';
  const SUPABASE_KEY='sb_publishable_Ee1penIBv8waTVZHe4dSXg_dA98_hMz';
  // Usuário digitado -> conta interna (o e-mail interno nunca recebe mensagem)
  const CONTAS={kaique:'kaique@aulas.local',bernardo:'bernardo@aulas.local',joaolucas:'joaolucas@aulas.local',myrella:'myrella@aulas.local'};
  const $$=id=>document.getElementById(id);
  const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
  function fechar(){ $$('painel').classList.toggle('on',false); }
  function say(t,ok){ $$('msgacesso').textContent=t; $$('msgacesso').style.color=ok?'#7fe0a0':'#ff8080'; }
  $$('abrir').addEventListener('click',()=>{ $$('painel').classList.toggle('on',true); $$('a-user').focus(); });
  $$('fechar').addEventListener('click',fechar);
  $$('painel').addEventListener('click',e=>{ if(e.target.id==='painel') fechar(); });
  $$('form-acesso').addEventListener('submit',async e=>{
    e.preventDefault();
    if(!sb){ say('Serviço indisponível agora. Tente mais tarde.',false); return; }
    const usuario=$$('a-user').value.trim().toLowerCase();
    const email=CONTAS[usuario];
    if(!email){ say('Usuário ou senha incorretos.',false); return; }
    const btn=$$('a-enviar'); btn.disabled=true;
    try{
      const r=await sb.auth.signInWithPassword({email,password:$$('a-senha').value});
      if(r.error) throw r.error;
      say('Entrou. Sua espaçonave será aberta aqui em breve.',true);
    }catch(err){ say('Usuário ou senha incorretos.',false); }
    btn.disabled=false;
  });
})();
</script>
<script>
(function(){
  const s=document.querySelector('#space'); if(!s) return;
  for(let i=0;i<60;i++){const e=document.createElement('div');e.className='star';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*3)+'s';s.appendChild(e);}
})();
</script>
</body></html>
