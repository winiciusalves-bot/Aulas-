<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Espaçonave Bernardo</title><style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;color:#e8f0ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:8px 0}
.card{background:#0f1830;border-radius:16px;padding:16px;margin:12px 0}
a.btn,button{display:inline-block;background:#2a7de1;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;text-decoration:none;margin:4px;cursor:pointer}
button.alt{background:transparent;border:2px solid #5aa2ff}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0f1830;border:2px solid #2a7de1;color:#e8f0ff;border-radius:12px;padding:8px 12px;cursor:pointer}
.chip.on{background:#ffd54a;color:#1d2433}
#space{position:fixed;inset:0;background:radial-gradient(#0a1230,#05070d);overflow:hidden;z-index:5;transition:opacity .8s}
#space.gone{opacity:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:warp 1.6s linear infinite}
@keyframes warp{from{transform:scale(.2);opacity:0}to{transform:scale(4);opacity:1}}
#ship{position:absolute;left:50%;top:60%;width:90px;transform:translate(-50%,-50%);animation:fly 3.2s ease-in forwards}
@keyframes fly{to{transform:translate(-50%,-50%) scale(.05);opacity:0}}
#grid{position:absolute;inset:0;background-image:linear-gradient(#1d3a6b 1px,transparent 1px),linear-gradient(90deg,#1d3a6b 1px,transparent 1px);background-size:40px 40px;opacity:.35;animation:zoom 3.2s ease-in forwards}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(4)}}
#skip{position:fixed;bottom:16px;right:16px;z-index:6}
.avatar{width:220px;max-width:100%;display:block;margin:0 auto}
.help{opacity:.8;font-size:14px}
</style></head><body>
<div id="space"><div id="grid"></div><svg id="ship" viewBox="0 0 120 80"><path d="M10 40 L60 10 L110 40 L60 70 Z" fill="#c9d6ff" stroke="#5aa2ff" stroke-width="3"/><circle cx="60" cy="40" r="10" fill="#2a7de1"/></svg><button id="skip" class="alt">Pular</button></div>
<h1>Bernardo, bem-vindo ao computador infinito</h1>
<div class="card"><h2 style="font-size:18px;margin:0 0 8px">Sua skin</h2>
<div id="avatar"></div>
<div class="help">Cor</div><div id="cores" class="grid"></div>
<div class="help" style="margin-top:8px">Estampa</div><div id="pads" class="grid"></div>
<div class="help" style="margin-top:8px">Adereços (escolha quantos quiser)</div><div id="accs" class="grid"></div>
<p><button id="salvar">Salvar neste aparelho</button><button id="limpar" class="alt">Limpar</button></p>
<p id="msg" class="help"></p></div>
<div class="card"> <a class="btn alt" href="index.html">Voltar à espaçonave</a></div>
<script>
const $=id=>document.getElementById(id);
function enter(){ $('space').classList.add('gone'); }
window.addEventListener('DOMContentLoaded',()=>{
  const s=$('space'); for(let i=0;i<60;i++){const e=document.createElement('div');e.className='star';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*1.6)+'s';s.appendChild(e);}
  setTimeout(enter,3600); $('skip').onclick=enter;
});
const KEY="bernardo";
const COLORS=['#2a7de1','#e14b6a','#2ec27e','#ffb800','#9b5de5','#1d2433','#ff7a59','#ffffff'];
const PATTERNS=['liso','listras','bolinhas','xadrez'];
const ACCS=[['capa','Capa'],['espada','Espada de treino'],['escudo','Escudo'],['oculos','Óculos'],['chapeu','Chapéu'],['bone','Boné'],['laser','Laser de brinquedo'],['estrela','Estrela na mão'],['maquiagem','Maquiagem'],['mochila','Mochila']];
const SKEY='skin-'+KEY;
let st={cor:'#2a7de1',pad:'liso',acc:[]};
try{const x=localStorage.getItem(SKEY); if(x) st=Object.assign(st,JSON.parse(x));}catch(e){}
function svg(){
  const a=st.acc, c=st.cor;
  let pat='';
  if(st.pad==='listras') pat='<rect x="60" y="130" width="100" height="10" fill="#ffffff55"/><rect x="60" y="150" width="100" height="10" fill="#ffffff55"/><rect x="60" y="170" width="100" height="10" fill="#ffffff55"/>';
  if(st.pad==='bolinhas') pat='<circle cx="75" cy="140" r="5" fill="#ffffff66"/><circle cx="110" cy="160" r="5" fill="#ffffff66"/><circle cx="145" cy="140" r="5" fill="#ffffff66"/>';
  if(st.pad==='xadrez') pat='<rect x="60" y="130" width="25" height="25" fill="#ffffff44"/><rect x="110" y="130" width="25" height="25" fill="#ffffff44"/><rect x="85" y="155" width="25" height="25" fill="#ffffff44"/><rect x="135" y="155" width="25" height="25" fill="#ffffff44"/>';
  return `<svg class="avatar" viewBox="0 0 220 260" role="img" aria-label="Sua skin">
  ${a.includes('capa')?'<path d="M55 120 L30 250 L190 250 L165 120 Z" fill="#7a1fa2" opacity=".85"/>':''}
  <rect x="65" y="120" width="90" height="110" rx="20" fill="${c}"/>${pat}
  ${a.includes('mochila')?'<rect x="140" y="130" width="28" height="50" rx="6" fill="#4a3728"/>':''}
  <rect x="78" y="228" width="30" height="24" rx="6" fill="#1d2433"/><rect x="112" y="228" width="30" height="24" rx="6" fill="#1d2433"/>
  <rect x="50" y="130" width="18" height="60" rx="8" fill="${c}"/><rect x="152" y="130" width="18" height="60" rx="8" fill="${c}"/>
  <circle cx="110" cy="85" r="46" fill="#ffd9b3"/>
  ${a.includes('chapeu')?'<rect x="60" y="30" width="100" height="18" rx="6" fill="#1d2433"/><rect x="80" y="8" width="60" height="30" rx="8" fill="#1d2433"/>':''}
  ${a.includes('bone')?'<path d="M62 60 Q110 20 158 60 L158 66 L62 66 Z" fill="#2ec27e"/><rect x="132" y="62" width="34" height="8" rx="4" fill="#2ec27e"/>':''}
  <circle cx="96" cy="85" r="5" fill="#1d2433"/><circle cx="124" cy="85" r="5" fill="#1d2433"/>
  ${a.includes('oculos')?'<circle cx="96" cy="85" r="13" fill="none" stroke="#1d2433" stroke-width="3"/><circle cx="124" cy="85" r="13" fill="none" stroke="#1d2433" stroke-width="3"/><line x1="109" y1="85" x2="111" y2="85" stroke="#1d2433" stroke-width="3"/>':''}
  ${a.includes('maquiagem')?'<circle cx="82" cy="100" r="7" fill="#ff7a9a" opacity=".7"/><circle cx="138" cy="100" r="7" fill="#ff7a9a" opacity=".7"/>':''}
  <path d="M98 108 Q110 118 122 108" stroke="#1d2433" stroke-width="3" fill="none"/>
  ${a.includes('escudo')?'<path d="M30 140 L50 135 L50 175 Q40 190 30 185 Z" fill="#ffb800" stroke="#1d2433" stroke-width="2"/>':''}
  ${a.includes('espada')?'<rect x="180" y="110" width="8" height="90" fill="#c9d6ff"/><rect x="172" y="200" width="24" height="6" fill="#ffb800"/>':''}
  ${a.includes('laser')?'<rect x="180" y="175" width="30" height="10" rx="4" fill="#1d2433"/><rect x="208" y="177" width="14" height="6" fill="#ff3b3b"/>':''}
  ${a.includes('estrela')?'<polygon points="30,200 36,214 50,214 39,222 43,236 30,228 17,236 21,222 10,214 24,214" fill="#ffd54a"/>':''}
  </svg>`;
}
function paint(){
  $('avatar').innerHTML=svg();
  $('cores').innerHTML=COLORS.map(c=>`<button class="chip ${st.cor===c?'on':''}" style="background:${c};width:44px;height:44px;padding:0" data-c="${c}" aria-label="cor ${c}"></button>`).join('');
  $('pads').innerHTML=PATTERNS.map(p=>`<button class="chip ${st.pad===p?'on':''}" data-p="${p}">${p}</button>`).join('');
  $('accs').innerHTML=ACCS.map(([k,l])=>`<button class="chip ${st.acc.includes(k)?'on':''}" data-a="${k}">${l}</button>`).join('');
}
function save(){ try{localStorage.setItem(SKEY,JSON.stringify(st));$('msg').textContent='Skin salva neste aparelho.';}catch(e){$('msg').textContent='Não foi possível salvar neste aparelho. Dá para usar sem salvar.';} }
window.addEventListener('DOMContentLoaded',()=>{
  paint();
  $('cores').onclick=e=>{const b=e.target.closest('[data-c]'); if(b){st.cor=b.dataset.c; paint();}};
  $('pads').onclick=e=>{const b=e.target.closest('[data-p]'); if(b){st.pad=b.dataset.p; paint();}};
  $('accs').onclick=e=>{const b=e.target.closest('[data-a]'); if(b){const k=b.dataset.a; st.acc=st.acc.includes(k)?st.acc.filter(x=>x!==k):[...st.acc,k]; paint();}};
  $('limpar').onclick=()=>{st={cor:'#2a7de1',pad:'liso',acc:[]}; paint(); try{localStorage.removeItem(SKEY);}catch(e){} $('msg').textContent='Skin limpa.';};
  $('salvar').onclick=save;
});
</script></body></html>
